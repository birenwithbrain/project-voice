name: project-voice

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voice_coach}
      POSTGRES_USER: ${POSTGRES_USER:-voice_coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - project_voice_postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      VOICE_COACH_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-voice_coach}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-voice_coach}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["setup"]

  api:
    build:
      context: ./apps/api
    environment:
      VOICE_COACH_ENVIRONMENT: development
      VOICE_COACH_API_CORS_ORIGINS: http://localhost:3000
      VOICE_COACH_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-voice_coach}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-voice_coach}
      VOICE_COACH_GEMINI_API_KEY: ${VOICE_COACH_GEMINI_API_KEY:-}
      VOICE_COACH_GEMINI_MODEL: ${VOICE_COACH_GEMINI_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  project_voice_postgres:
