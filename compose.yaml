name: project-voice

services:
  api:
    build:
      context: ./apps/api
    environment:
      VOICE_COACH_ENVIRONMENT: development
      VOICE_COACH_API_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
